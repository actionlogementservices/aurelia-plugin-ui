<template>
  <require from="resources/assets/icons/als-logo.html"></require>

  <div class="d-flex flex-column min-vh-100">
    <header class="d-flex justify-content-between align-items-center px-4 py-2 border-bottom">
      <a route-href="route: home" class="d-flex align-items-center gap-2 text-decoration-none fw-semibold">
        <als-logo></als-logo>
        Demo application
      </a>
      <als-user-menu initials="UA" items.bind="userMenuItems"></als-user-menu>
    </header>

    <div class="flex-grow-1 p-4">
      <h1>Page content</h1>
      <form novalidate class="container-fluid">
        <div class="row">
          <div class="col">
            <als-field label="Name" required="true">
              <input
                class="form-control"
                name="name"
                placeholder="Votre nom"
                required
                value.bind="formData.name & validate" />
            </als-field>
            <p>NAME = ${formData.name}</p>
          </div>
          <div class="col">
            <als-field label="Email" required="true">
              <input
                type="email"
                class="form-control"
                name="email"
                placeholder="Votre email"
                autocomplete="email"
                input-filter="email"
                required
                value.bind="formData.email & validate" />
            </als-field>
            <p>EMAIL = ${formData.email}</p>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <als-field label="Age" required="true" hint="Valeur comprise entre 18 et 150.">
              <input
                class="form-control"
                name="age"
                required
                input-mask="integer"
                value.bind="formData.age | formInputNumberFormat:'integer' & validate" />
            </als-field>
            <p>AGE = ${formData.age}</p>
          </div>
          <div class="col">
            <als-field label="Age" required="true" hint="Valeur comprise entre 18 et 150.">
              <input
                class="form-control"
                name="age"
                required
                input-mask="integer"
                value.bind="formData.age | formInputNumberFormat:'integer' & validate" />
            </als-field>
            <p>AGE duplicate = ${formData.age}</p>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <als-field label="Height" required="true">
              <input
                class="form-control"
                name="height"
                required
                input-mask="decimal"
                value.bind="formData.height | formInputNumberFormat:'decimal' & validate" />
            </als-field>
            <p>HEIGHT = ${formData.height}</p>
          </div>
          <div class="col">
            <als-field label="Money" required="true">
              <input
                class="form-control"
                name="money"
                required
                input-mask="currency"
                value.bind="formData.money | formInputNumberFormat:'currency' & validate" />
              <span class="input-group-text" aria-hidden="true">€</span>
            </als-field>
            <p>MONEY = ${formData.money}</p>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <als-field label="Password" required="true">
              <input
                type="password"
                class="form-control"
                name="password"
                autocomplete="new-password"
                required
                value.bind="formData.password & validate" />
              <als-password-toggle></als-password-toggle>
            </als-field>
            <p>PASSWORD = ${formData.password}</p>
          </div>
          <div class="col">
            <als-field label="Year" required="true">
              <select class="form-select" name="year" required value.bind="formData.year & validate">
                <option model.bind="null">Sélectionner</option>
                <option repeat.for="item of yearOptions" model.bind="item.value">${item.label}</option>
              </select>
            </als-field>
            <p>YEAR = ${formData.year}</p>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <als-field label="Years" required="true">
              <als-multi-select
                items.bind="yearOptions"
                value.bind="formData.years & validate"></als-multi-select>
            </als-field>
            <p>YEARS = [${formData.years}]</p>
          </div>
          <div class="col">
            <als-field label="Date" required="true">
              <als-datepicker
                value.bind="formData.date & validate"
                min-date.bind="mindateString"
                max-date.bind="maxDateString"></als-datepicker>
            </als-field>
            <p>DATE = ${formData.date}</p>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <als-field label="Civilité" required="true" group="true">
              <div repeat.for="item of civilityOptions" class="form-check form-check-inline">
                <input
                  type="radio"
                  class="form-check-input"
                  id="civility-${item.value}"
                  name="civility"
                  model.bind="item.value"
                  checked.bind="formData.civility & validate" />
                <label class="form-check-label" for="civility-${item.value}">${item.label}</label>
              </div>
            </als-field>
            <p>CIVILITY = ${formData.civility}</p>
          </div>
          <div class="col">
            <als-field>
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="terms"
                  name="terms"
                  checked.bind="formData.terms & validate" />
                <label class="form-check-label" for="terms">J'accepte les conditions d'utilisation</label>
              </div>
            </als-field>
            <p>TERMS = ${formData.terms}</p>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <als-field label="Centres d'intérêt" required="true" hint="Au moins un choix." group="true">
              <div repeat.for="item of interestOptions" class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="interest-${item.value}"
                  model.bind="item.value"
                  checked.bind="formData.interests & validate" />
                <label class="form-check-label" for="interest-${item.value}">${item.label}</label>
              </div>
            </als-field>
            <p>INTERESTS = [${formData.interests}]</p>
          </div>
          <div class="col">
            <als-field label="Commentaire" required="true" hint="200 caractères maximum.">
              <textarea
                class="form-control"
                name="comment"
                rows="4"
                placeholder="Votre commentaire"
                required
                value.bind="formData.comment & validate"></textarea>
            </als-field>
            <p class="text-break">COMMENT = ${formData.comment}</p>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <button class="btn btn-primary" type="button" click.trigger="handleSubmit()">SUBMIT</button>
          </div>
        </div>
      </form>
    </div>

    <als-footer links.bind="footerLinks"></als-footer>
  </div>
</template>
