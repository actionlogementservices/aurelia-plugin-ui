<template>
  <require from="./als-field.css"></require>

  <div
    class="form-group"
    role.bind="group ? 'group' : null & attr"
    aria-labelledby.bind="group && label ? labelId : null"
    aria-describedby.bind="group ? groupDescribedBy : null">
    <label if.bind="label && !group" for.bind="controlId" class="form-label text-primary">
      ${label}
      <span if.bind="required" class="text-danger" aria-hidden="true">*</span>
    </label>
    <div if.bind="label && group" id.bind="labelId" class="form-label text-primary">
      ${label}
      <span if.bind="required" class="text-danger" aria-hidden="true">*</span>
    </div>
    <div class.bind="group ? '' : 'input-group'">
      <slot></slot>
    </div>
    <div if.bind="hint" id.bind="hintId" class="form-text">${hint}</div>
    <small show.bind="errorMessage" id.bind="errorId" role="alert" class="invalid-feedback">
      ${errorMessage}
    </small>
  </div>
</template>
