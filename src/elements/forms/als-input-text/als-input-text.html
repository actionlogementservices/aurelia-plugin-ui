<template>
  <div class="form-group">
    <label
      class="form-label"
      if.bind="!fieldOnly"
      show.bind="label !== ''"
      for.bind="id"
      class="form-label text-primary">
      ${label}<span class="text-danger">${required ? ' *' : ''}</span>
    </label>
    <div class="input-group">
      <input
        class="form-control ${isError ? 'is-invalid' : ''}"
        type="text"
        inputmode.bind="type === 'email' ? 'email' : 'text'"
        id.bind="id"
        name.bind="name"
        required.bind="required"
        placeholder.bind="placeholder"
        disabled.bind="disabled"
        readonly.bind="readonly"
        pattern.bind="type === 'email' ? '^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$' : null"
        focus.trigger="handleFocus($event)"
        keydown.trigger="handleKeyDown($event)"
        blur.trigger="handleBlur($event)"
        value.bind="value" />
    </div>
    <small if.bind="!fieldOnly" show.bind="isError" class="text-danger">${errorMessage}</small>
  </div>
</template>
