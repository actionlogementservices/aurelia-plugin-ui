<template>
  <require from="./als-datepicker.css"></require>

    <div class="form-group">
    <label
      class="form-label"
      if.bind="!fieldOnly"
      show.bind="label !== ''"
      for.bind="id"
      class="form-label text-primary">
      ${label}<span class="text-danger">${required ? ' *' : ''}</span>
    </label>
    <div class="input-group">
      <input-datepicker
        class="als-datepicker form-select ${isError ? 'is-invalid' : ''}"
        id.bind="id"
        date.bind="value"
        placeholder.bind="placeholder"
        disabled.bind="disabled"
        readonly.bind="readonly"
        autohide.bind="autohide"
        disabled-days.bind="disabledDays"
        disabled-dates.bind="disabledDates"
        min-date.bind="minDate"
        max-date.bind="maxDate"
        aria-invalid.bind="isError ? 'true' : 'false'"
        aria-describedby.bind="ariaDescribedby"
        change.trigger="handleChange($event)"
        blur.trigger="handleBlur($event)"></input-datepicker>
      <div class="input-group-text" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="6" width="18" height="15" rx="2" stroke="#33363F" stroke-width="2" />
          <path
            d="M3 10C3 8.11438 3 7.17157 3.58579 6.58579C4.17157 6 5.11438 6 7 6H17C18.8856 6 19.8284 6 20.4142 6.58579C21 7.17157 21 8.11438 21 10H3Z"
            fill="#33363F" />
          <path d="M7 3L7 6" stroke="#33363F" stroke-width="2" stroke-linecap="round" />
          <path d="M17 3L17 6" stroke="#33363F" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <small if.bind="!fieldOnly" show.bind="isError" id="${id}-error" role="alert" class="text-danger">${errorMessage}</small>
  </div>
</template>
