<template>
  <require from="./als-multi-select.css"></require>

  <div focusout.trigger="handleFocusout($event)">
    <als-dropdown
      auto-close="outside"
      aria-describedby="${uniqueId}-text"
      menu-aria-label.bind="placeholder"
      disabled.bind="disabled"
      toggle-class="multi-select-toggle"
      menu-class="multi-select-menu">
      <span
        slot="toggle"
        id="${uniqueId}-text"
        class="multi-select-toggle-text"
        title.bind="selectedLabelsText || null">
        ${selectedLabelsText || placeholder}
      </span>
      <div if.bind="items.length > 0" class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="${uniqueId}-all"
          disabled.bind="disabled"
          checked.one-way="allSelected"
          indeterminate.one-way="isIndeterminate"
          change.trigger="toggleAll()" />
        <label class="form-check-label" for="${uniqueId}-all">Tout sélectionner</label>
      </div>
      <li if.bind="!items.length" class="dropdown-item">
        <span>Aucun élément disponible</span>
      </li>
      <hr if.bind="items.length > 0" class="dropdown-divider" aria-hidden="true" />
      <div class="form-check" repeat.for="item of items">
        <input
          type="checkbox"
          class="form-check-input"
          id="${uniqueId}-${$index}"
          disabled.bind="disabled"
          checked.one-way="selected.includes(item.value)"
          change.trigger="toggleItem(item)" />
        <label class="form-check-label" for="${uniqueId}-${$index}">${item.label}</label>
      </div>
    </als-dropdown>
  </div>
</template>
