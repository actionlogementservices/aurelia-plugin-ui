<template>
  <require from="./als-multi-select.css"></require>

  <div class="form-group">
    <label if.bind="!fieldOnly" for.bind="id" class="form-label text-primary">
      ${label || placeholder || 'Sélectionner'}<span class="text-danger">${required ? ' *' : ''}</span>
    </label>

    <als-dropdown
      unique-id.bind="id"
      auto-close="outside"
      label.bind="label || placeholder || 'Sélectionner'"
      aria-label.bind="toggleAriaLabel"
      aria-describedby.bind="isError ? id + '-error' : null"
      menu-aria-label.bind="label || placeholder || 'Sélectionner'"
      disabled.bind="disabled"
      on-focus.bind="handleButtonFocus"
      toggle-class="multi-select-toggle"
      menu-class="multi-select-menu">
      <span slot="toggle">
        ${placeholder || 'Sélectionner'}
      </span>
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="${id}-select-all"
          disabled.bind="disabled"
          checked.one-way="allSelected"
          indeterminate.bind="isIndeterminate"
          change.trigger="handleToggleAll($event)"/>
          <label class="form-check-label" for="${id}-select-all">Tout sélectionner</label>
      </div>
      <hr if.bind="items && items.length > 0" class="dropdown-divider" aria-hidden="true"/>
      <div if.bind="items && items.length > 0" class="form-check" repeat.for="item of items">
        <input
          type="checkbox"
          class="form-check-input"
          id="${id}-${item.value}"
          disabled.bind="disabled"
          checked.bind="checkedItems[$index]"
          value.bind="item.value"
          aria-required.bind="required"
          change.trigger="handleChange($event, item, $index)"/>
          <label class="form-check-label" for="${id}-${item.value}">${item.label}</label>
      </div>
    </als-dropdown>

    <small if.bind="!fieldOnly" show.bind="isError" id="${id}-error" class="text-danger">${errorMessage}</small>
  </div>
</template>
