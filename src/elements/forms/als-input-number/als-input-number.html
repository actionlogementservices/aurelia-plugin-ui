<template>
  <require from="./als-input-number.css"></require>
  <div class="form-group">
    <label
      class="form-label"
      if.bind="!fieldOnly"
      show.bind="label !== ''"
      for.bind="id"
      class="form-label text-primary">
      ${label}<span class="text-danger">${required ? ' *' : ''}</span>
    </label>
   <div class="input-group">
     <input
        class="form-control ${isError ? 'is-invalid' : ''}"
        type="text"
        inputmode="numeric"
        id.bind="id"
        name.bind="name"
        required.bind="required"
        step.bind="step"
        min.bind="min"
        max.bind="max"
        placeholder.bind="placeholder"
        disabled.bind="disabled"
        readonly.bind="readonly"
        input-mask.bind="type"
        value.to-view="value | formInputNumberFormat: type"
        value.from-view="value | cleanInputMask"
        aria-invalid.bind="isError ? 'true' : 'false'"
        aria-describedby.bind="ariaDescribedby"
        focus.trigger="handleFocus($event)"
        keydown.trigger="handleKeyDown($event)"
        change.trigger="handleChange($event)"
        blur.trigger="handleBlur($event)" />
        <div if.bind="type === 'currency'" class="input-group-text" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M15.0002 18.5C13.8114 18.5011 12.6453 18.1751 11.6293 17.5578C10.6134 16.9405 9.78688 16.0556 9.2402 15H14.3802C14.7602 15 15.1102 14.79 15.2702 14.45C15.6002 13.79 15.1202 13 14.3802 13H8.5802C8.5302 12.67 8.5002 12.34 8.5002 12C8.5002 11.66 8.5302 11.33 8.5802 11H14.3802C14.7602 11 15.1102 10.79 15.2702 10.45C15.3487 10.298 15.3866 10.1282 15.3803 9.95727C15.374 9.78628 15.3236 9.61982 15.2341 9.474C15.1446 9.32818 15.019 9.20793 14.8694 9.12489C14.7198 9.04185 14.5513 8.99883 14.3802 9H9.2402C9.78777 7.94511 10.6145 7.06084 11.6302 6.44365C12.646 5.82646 13.8117 5.50004 15.0002 5.5C16.2502 5.5 17.4202 5.86 18.4202 6.47C18.9202 6.78 19.5702 6.73 19.9902 6.31C20.5702 5.73 20.4402 4.78 19.7402 4.35C18.3159 3.46919 16.6748 3.00178 15.0002 3C11.0802 3 7.7602 5.51 6.5202 9H3.6202C3.2402 9 2.8902 9.21 2.7202 9.55C2.3902 10.22 2.8702 11 3.6202 11H6.0602C5.97958 11.6642 5.97958 12.3358 6.0602 13H3.6202C3.2402 13 2.8902 13.21 2.7302 13.55C2.3902 14.22 2.8702 15 3.6202 15H6.5202C7.7602 18.49 11.0802 21 15.0002 21C16.7402 21 18.3602 20.51 19.7402 19.65C20.4302 19.22 20.5602 18.26 19.9802 17.68C19.5602 17.26 18.9102 17.21 18.4102 17.53C17.4202 18.15 16.2602 18.5 15.0002 18.5Z"
              fill="black" />
          </svg>
        </div>
    </div>
    <small if.bind="!fieldOnly" id="${id}-hint" class="visually-hidden">${rangeHint}</small>
    <small if.bind="!fieldOnly" show.bind="isError" id="${id}-error" role="alert" class="text-danger">${errorMessage}</small>
  </div>
</template>
