<template>
  <require from="./als-input-number.css"></require>
  <div class="form-group">
    <label
      class="form-label"
      if.bind="!fieldOnly"
      show.bind="label !== ''"
      for.bind="id"
      class="form-label text-primary">
      ${label}<span class="text-danger">${required ? ' *' : ''}</span>
    </label>
   <div class="input-group">
     <input
        class="form-control ${isError ? 'is-invalid' : ''}"
        type="text"
        inputmode="numeric"
        id.bind="id"
        name.bind="name"
        required.bind="required"
        step.bind="step"
        min.bind="min"
        max.bind="max"
        placeholder.bind="placeholder"
        disabled.bind="disabled"
        readonly.bind="readonly"
        input-mask.bind="type"
        value.one-time="value | formInputNumberFormat: type"
        value.from-view="value | cleanInputMask"
        focus.trigger="pristine = false"
        keydown.trigger="handleKeyDown($event)"
        blur.trigger="handleBlur()" />
        <img if.bind="type === 'currency'" class="input-group-text" src="/static/icons/euro.svg" alt=""/>
    </div>
    <small if.bind="!fieldOnly" show.bind="isError" class="text-danger">${errorMessage}</small>
  </div>
</template>
