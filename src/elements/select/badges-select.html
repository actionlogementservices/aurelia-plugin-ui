<template>
  <require from="./select.css"></require>
  <div id="badges-select-${uniqueId}" class="dropdown">
    <!-- badges section -->
    <div show.bind="selectedItems.length > 0" class="badges-container container-fluid overflow-auto">
      <span
        repeat.for="b of selectedItems"
        class="badge bg-secondary m-1 p-2 d-inline-flex align-items-center justify-content-center">
        <button
          type="button"
          class="btn border-0 p-0 me-2 text-white lh-1"
          aria-label="Retirer ${b[$parent.labelKey]}"
          disabled.bind="disabled"
          click.trigger="removeItem(b)">
          <i class="bi bi-x-lg fs-6" aria-hidden="true"></i>
        </button>
        ${b[$parent.labelKey]}
      </span>
    </div>
    <!-- combobox enabling filtering (WAI-ARIA combobox pattern, see core/combobox) -->
    <input
      id="searchText-${uniqueId}"
      placeholder="${placeholder || ''}"
      type="text"
      disabled.bind="disabled"
      class="form-select border-0 shadow-none ${selectedItems.length > 0 ? 'items-selected' : ''}"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      style="cursor: auto"
      data-bs-toggle="dropdown"
      role="combobox"
      aria-autocomplete="list"
      aria-expanded="false"
      aria-controls="dropDown-${uniqueId}"
      input.trigger="onInputChange($event.target.value)"
      blur.trigger="onInputBlur()"
      keydown.trigger="manageKey($event)" />
    <!-- listbox: a click on an option keeps the focus on the input -->
    <div
      id="dropDown-${uniqueId}"
      class="dropdown-menu dropdown-menu-scroll ${autosize ? 'dropdown-menu-autosize' : ''}"
      role="listbox"
      mousedown.trigger="$event.preventDefault()">
      <div
        repeat.for="item of filteredItems"
        id="${uniqueId}-option-${$index}"
        class="dropdown-item"
        role="option"
        aria-selected="false"
        click.trigger="selectItem(item)">
        <template replaceable part="itemTemplate">
          <compose view.bind="itemView" view-model.bind="item"></compose>
        </template>
      </div>
      <div
        show.bind="filteredItemsCount === 0"
        class="dropdown-item disabled"
        role="option"
        aria-selected="false"
        aria-disabled="true">
        ${noResultText}
      </div>
    </div>
  </div>
</template>
