<template>
  <require from="./select.css"></require>
  <div id="filterable-select-${uniqueId}" class="dropdown">
    <!-- combobox displaying label key property and enabling filtering (WAI-ARIA combobox pattern, see core/combobox) -->
    <input
      id="searchText-${uniqueId}"
      placeholder="${placeholder || ''}"
      type="text"
      disabled.bind="disabled"
      class="form-select border-0 shadow-none"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      data-bs-toggle="dropdown"
      style="cursor: auto"
      role="combobox"
      aria-autocomplete="list"
      aria-expanded="false"
      aria-controls="dropDown-${uniqueId}"
      input.trigger="onInputChange($event.target.value)"
      blur.trigger="onInputBlur()"
      keydown.trigger="manageKey($event)" />
    <!-- listbox: a click on an option keeps the focus on the input -->
    <div
      id="dropDown-${uniqueId}"
      class="dropdown-menu dropdown-menu-scroll ${autosize ? 'dropdown-menu-autosize' : ''}"
      role="listbox"
      mousedown.trigger="$event.preventDefault()">
      <div
        if.bind="selectedItem"
        id="${uniqueId}-option-clear"
        class="dropdown-item border-bottom border-top"
        role="option"
        aria-selected="false"
        click.trigger="selectItem(null)">
        <div class="text-muted">${clearSelectionText}</div>
      </div>
      <div
        repeat.for="item of filteredItems"
        id="${uniqueId}-option-${$index}"
        class="dropdown-item"
        role="option"
        aria-selected="${item === selectedItem}"
        click.trigger="selectItem(item)">
        <template replaceable part="itemTemplate">
          <compose view.bind="itemView" view-model.bind="item"></compose>
        </template>
      </div>
      <div
        show.bind="filteredItemsCount === 0"
        class="dropdown-item disabled"
        role="option"
        aria-selected="false"
        aria-disabled="true">
        ${noResultText}
      </div>
    </div>
  </div>
</template>
