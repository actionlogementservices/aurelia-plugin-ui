<template>
  <require from="./simple-table.css"></require>
  <!-- where columns definition will be projected -->
  <slot></slot>
  <!-- title of the table, naming it (aria-labelledby): above the detail bar, which a <caption> would come below -->
  <div if.bind="caption && !hideCaption" id="caption-${uniqueId}" class="fw-semibold fs-5 px-2 mb-1">${caption}</div>
  <!-- detail bar, aligned with the content of the cells (padding of the bootstrap cells) -->
  <div if.bind="!noRowCountHeader" class="d-flex flex-wrap align-items-baseline column-gap-3 px-2 mb-2">
    <!-- announced by the screen readers when the count changes (filter, page) or the rows are loading -->
    <span role="status">
      <span if.bind="loading" class="d-inline-flex align-items-center gap-2 fw-semibold">
        <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
        ${loadingText}
      </span>
      <span if.bind="!loading && items.length > 0" class="fw-semibold">${countText}</span>
    </span>
    <!-- tells the screen readers that the button selecting every page appeared before the table, above the focus -->
    <span role="status" class="visually-hidden">
      ${canSelectAllResults ? selectAllHintText.replace('{button}', selectAllButtonText) : ''}
    </span>
    <span if.bind="selectedItems.length > 0" class="text-body-secondary">
      ${selectedItems.length} ${selectedText}
    </span>
    <!-- the rows of the other pages of an array datasource, once the rows of the page are all selected -->
    <button
      if.bind="canSelectAllResults"
      type="button"
      class="btn btn-link p-0 align-baseline"
      disabled.bind="disabled"
      click.trigger="selectAllResults()">
      ${selectAllButtonText}
    </button>
    <!-- a selection beyond the page can't be cleared from the page -->
    <button
      if.bind="selectedItems.length > pageSelectedCount"
      type="button"
      class="btn btn-link p-0 align-baseline clear-selection"
      disabled.bind="disabled"
      click.trigger="clearSelection()">
      ${clearSelectionText}
    </button>
    <span if.bind="items.length > 0 && !allItemsDisplayed" class="text-warning-emphasis">
      <i class="bi bi-exclamation-triangle-fill me-1" aria-hidden="true"></i>
      ${notDisplayedWarningText}
    </span>
  </div>
  <div class="table-wrapper" css="max-height: ${maxHeight}">
    <table
      id="grid-${uniqueId}"
      class="table table-hover ${disabled || loading ? 'table-disabled' : ''}"
      aria-labelledby.bind="caption && !hideCaption ? 'caption-' + uniqueId : null"
      aria-label.bind="caption && hideCaption ? caption : null"
      aria-busy.bind="loading ? 'true' : null">
      <thead>
        <!-- column headers -->
        <tr>
          <!-- optional tick header -->
          <th if.bind="selectionMode != 'none'" class="selection align-middle">
            <!-- for the rows of the page, mixed when a part of them is selected; the native change of the checkboxes stays inside the table,
                 which emits its own change event with the selection -->
            <input
              if.bind="selectionMode == 'multiple'"
              type="checkbox"
              class="form-check-input d-block m-0"
              checked.one-way="selectableItemCount > 0 && pageSelectedCount === selectableItemCount"
              indeterminate.one-way="pageSelectedCount > 0 && pageSelectedCount < selectableItemCount"
              disabled.bind="disabled || selectableItemCount === 0"
              aria-label.bind="selectPageText"
              change.trigger="$event.stopPropagation() || toggleAllSelection()" />
          </th>
          <th
            repeat.for="column of columns"
            css="width: ${column.width}"
            scope="col"
            aria-sort.bind="column.sortable ? column.ariaSort : undefined"
            class="align-middle">
            <button
              type="button"
              if.bind="column.sortable"
              disabled.bind="disabled"
              click.trigger="sortDisplayedItems(column)">
              <compose
                if.bind="column.headerTemplate"
                view.bind="column.headerTemplate"
                containerless></compose>
              <span if.bind="!column.headerTemplate">${column.header}</span>
              <i class="bi bi-${column.sortIcon}" aria-hidden="true"></i>
            </button>
            <span if.bind="!column.sortable">
              <compose
                if.bind="column.headerTemplate"
                view.bind="column.headerTemplate"
                containerless></compose>
              <span if.bind="!column.headerTemplate">${column.header}</span>
            </span>
          </th>
        </tr>
      </thead>
      <tbody>
        <!-- rows -->
        <tr
          repeat.for="item of items"
          click.trigger="toggleItemSelection(item, $event)"
          class="align-middle ${selectedKeys.has(item[valueKey]) ? 'table-primary' : ''} ${selectionMode != 'none' ? 'selection' : ''}">
          <!-- optional tick cell -->
          <td if.bind="selectionMode != 'none'" class="py-0 align-middle selection">
            <input
              type="checkbox"
              class="form-check-input d-block m-0"
              checked.one-way="selectedKeys.has(item[valueKey])"
              disabled.bind="disabled || (disableableRows && item[disablePropName] === true)"
              aria-label.bind="selectRowText.replace('{row}', $index + 1)"
              change.trigger="$event.stopPropagation() || toggleSelection(item)" />
          </td>
          <td
            repeat.for="column of columns"
            css="max-width: ${column.width}"
            class="${fixedRowHeight ? 'fixed-height' : ''}">
            <compose if.bind="column.cellTemplate" view.bind="column.cellTemplate" containerless></compose>
            ${ (!column.cellTemplate && column.cellKey) ? item[column.cellKey] : '' }
          </td>
        </tr>
        <!-- no result text -->
        <tr if.bind="items.length == 0" class="table-info"><td colspan="100%">${noResultText}</td></tr>
      </tbody>
    </table>
  </div>
  <!-- pagination, aligned with the content of the cells like the detail bar -->
  <div if.bind="paginated" class="d-flex align-items-center gap-3 mt-2 px-2">
    <label class="d-flex align-items-center gap-2 small">
      <span class="text-body-secondary">${pageSizeText}</span>
      <select
        class="form-select form-select-sm w-auto"
        disabled.bind="disabled"
        change.trigger="$event.stopPropagation() || changePageSize($event.target.value)">
        <option repeat.for="size of pageSizes" value.bind="size" selected.bind="size === pageSize">
          ${size}
        </option>
      </select>
    </label>
    <nav if.bind="pageCount > 1" aria-label="Pagination" class="ms-auto">
      <ul class="pagination pagination-sm justify-content-end mb-0">
        <li class="page-item ${page <= 1 ? 'disabled' : ''}">
          <button
            type="button"
            class="page-link"
            disabled.bind="page <= 1"
            click.trigger="goToPage(page - 1)"
            aria-label="Page précédente">
            <i class="bi bi-chevron-left"></i>
          </button>
        </li>
        <li repeat.for="p of pages" class="page-item ${p === page ? 'active' : ''} ${p ? '' : 'disabled'}">
          <span if.bind="!p" class="page-link">…</span>
          <button
            else
            type="button"
            class="page-link"
            aria-current.bind="p === page ? 'page' : null"
            click.trigger="goToPage(p)">
            ${p}
          </button>
        </li>
        <li class="page-item ${page >= pageCount ? 'disabled' : ''}">
          <button
            type="button"
            class="page-link"
            disabled.bind="page >= pageCount"
            click.trigger="goToPage(page + 1)"
            aria-label="Page suivante">
            <i class="bi bi-chevron-right"></i>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</template>
